// ★ DÉBUTANT — CONFIGURATION DU JOUEUR (Nexi)
// ==================================================================

// ★ DÉBUTANT — LA COMPÉTENCE : ONDE N'SHIELD

};

// ★★ CODEUR — SPRITES DES BOSS (dessinés avec des formes)
// ==================================================================
// Chaque boss = une liste de formes (rect, ellipse, capsule, poly) avec
// une matière. Chaque matière a 3 tons : [clair, moyen, sombre].
// Les ombres et le contour sont calculés automatiquement.
// Le 3e nombre de construire() est l'échelle : 1.3 = 30 % plus grand.
const MAT_COMMUNES = {
  veine: { c: ["#ff7aa8", "#d0306a", "#7a0f3a"] }, cristal: { c: ["#ffd0d8", "#ff5e7a", "#a8123a"] },
  fer: { c: ["#d0d0e8", "#8a8aa8", "#4a4a66"] }, or: { c: ["#ffe680", "#d9a733", "#8a6a1a"] },
};
function construire(L, Hh, k, formes, mats, decor, decorFinal) {
  const s = v => v * k;
  const f2 = formes.map(f => f.t === "rect" ? Object.assign({}, f, { x: s(f.x), y: s(f.y), w: Math.round(s(f.w)), h: Math.round(s(f.h)) })
    : f.t === "ellipse" ? Object.assign({}, f, { x: s(f.x), y: s(f.y), rx: s(f.rx), ry: s(f.ry) })
    : f.t === "capsule" ? Object.assign({}, f, { x0: s(f.x0), y0: s(f.y0), x1: s(f.x1), y1: s(f.y1), r: Math.max(0.7, s(f.r)) })
    : Object.assign({}, f, { p: f.p.map(([x, y]) => [s(x), s(y)]) }));
  const d2 = (decor || []).map(d => [Math.round(s(d[0])), Math.round(s(d[1])), d[2], Math.max(1, Math.round((d[3] || 1) * k)), Math.max(1, Math.round((d[4] || 1) * k))]);
  return rendreFormes(Math.ceil(L * k), Math.ceil(Hh * k), f2, Object.assign({}, MAT_COMMUNES, mats), d2.concat(decorFinal || []));
}

  effets = effets.filter(e => e.restant > 0);
  // La porte tire au hasard un bonus OU un malus (forcément un malus si on s'est soigné « avec malus »)
  const estBonus = !malusForce && Math.random() < PORTES.CHANCE_BONUS;
  const liste = estBonus ? LISTE_BONUS : LISTE_MALUS;
  const def = liste[Math.floor(Math.random() * liste.length)];
  ajouterEffet(def);
  banniere = { titre: "-" + profondeur(salle) + " M - " + (estBonus ? "BONUS" : "MALUS") + " : " + def.nom, sous: def.desc,
    couleur: estBonus ? C.menthe : C.corail, t: 3.2 };
  chargerSalle(salle);
  if (introBoss) { introBoss.banniere = banniere; banniere = null; }  // le bandeau attend la fin de l'entrée du boss
  if (salleInfo.type === "terminal") banniere = { titre: "TERMINAL - PARTIE SAUVEGARDÉE", sous: "Approche-toi pour soigner, monter en niveau et t'équiper", couleur: C.menthe, t: 4 };
  if (salleInfo.type === "sanctuaire") banniere = { titre: "LE SANCTUAIRE DU VER ULTIME", sous: "Le fond de l'Abysse... Une lueur pulse dans le noir.", couleur: "#ffd84d", t: 4 };
}

// Taille de la zone de contact (hitbox) de chaque ennemi
const TAILLES = { ver: [26, 9], glitch: [22, 12], script: [12, 29], spyware: [16, 6], drone: [16, 10], zombie: [16, 22], trojan: [18, 31], parasite: [9, 9] };

function creerEnnemi(type, x, n) {
  const d = BESTIAIRE[type];
  // croissance exponentielle : chaque salle multiplie la force des ennemis (les dégâts montent un peu moins vite)
  const f = Math.pow(1 + MONSTRES.GAIN_PAR_SALLE, n - 1), fDeg = Math.pow(1 + MONSTRES.GAIN_PAR_SALLE * 0.6, n - 1);
  const pv = d.pv * MONSTRES.MULT_PV * f * (type === "parasite" ? 1 : multEffets("pvEnnemis"));
  return finirEnnemiElementaire(nouvelEnnemi(type, d, x, n, f, fDeg, pv));
}
function nouvelEnnemi(type, d, x, n, f, fDeg, pv) {
  const [w, h] = TAILLES[type];
  let y = SOL - h;
  if (type === "glitch") y = SOL - rnd(55, 70);
  if (type === "drone") y = SOL - rnd(68, 78);
  if (type === "parasite") y = SOL - 44;
  return {
    type, nom: d.nom, def: d, x, y, baseY: y, w, h,
    pv, pvMax: pv, degats: d.degats * MONSTRES.MULT_DEGATS * fDeg, vitesse: d.vitesse,
    spectre: !!d.spectre, defense: d.defense || 0,
    dir: -1, t: Math.random() * 3, minuteur: rnd(0.8, 2.2), etat: "normal",
    vx: 0, vy: 0, chrono: 0, charge: 0, aFrappe: false,
    flash: 0, brulure: 0, poison: { doses: 0, t: 0 }, jauge: 0, paralyse: 0, tickDot: 0, immuTxt: 0, mort: false,
    element: rendreElementaire(type, n),
  };
}
// Certains ennemis sont « élémentaires » : un peu plus résistants, leurs coups brûlent ou paralysent Nexi
function rendreElementaire(type, n) {
  if (type === "parasite" || n < 3 || Math.random() >= MONSTRES.CHANCE_ELEMENTAIRE) return null;
  return Math.random() < 0.5 ? "feu" : "foudre";
}
function finirEnnemiElementaire(e) { if (e.element) { e.pv = e.pvMax = e.pvMax * 1.25; e.nom = e.nom + (e.element === "feu" ? " de feu" : " de foudre"); } return e; }

// ---------- Dégâts infligés ----------
function immunise(e) { if (e.immuTxt <= 0) { nombre(e.x + e.w / 2, e.y - 8, "IMMUNISÉ", "#c9b0ff"); e.immuTxt = 0.6; } }

function frapperEnnemi(e, final) { toucherAvecArme(e, final, degatsArme(final), elementArme()); }

// L'onde N'Shield : touche tout ce qui est dans le cercle, Spectres compris
function lancerOnde(mode) {
  const drain = mode === "drain";
  const R = drain ? 46 : COMPETENCE.RAYON, D = drain ? 16 : COMPETENCE.DEGATS;
  const cx = J.x + J.w / 2, cy = J.y + 16;
  ondes.push({ x: cx, y: cy, t: 0, r: R, drain });
  secousse = Math.max(secousse, 0.2);
  let vole = 0;
  for (const e of ennemis) {
    if (e.mort || e.dormant > 0) continue;
    const d = Math.hypot(e.x + e.w / 2 - cx, e.y + e.h / 2 - cy);
    if (d > R + Math.max(e.w, e.h) / 2) continue;
    const inflige = infligerDegats(e, D * degatsMultJoueur(), true, false, "competence");
    vole += inflige;
    if (e.mort) { // synergie Nécromancie : l'ennemi drainé se relève pour Nexi
      if (drain && synergie("zombie") && !e.boss) allies.push({ type: "mini", x: e.x + e.w / 2, y: SOL - 9, w: 7, h: 9, vie: 8, cd: 0.3, dir: J.dir, delai: 0.2 });
      continue;
    }
    appliquerElement(e, inflige);
    if (e.spectre) { e.materialise = e.boss ? 1.5 : 3; nombre(e.x + e.w / 2, e.y - 14, "MATÉRIALISÉ", C.menthe); } // l'onde rend les Spectres tangibles
    e.paralyse = Math.max(e.paralyse, e.boss ? 0.3 : drain ? 0.4 : COMPETENCE.ETOURDISSEMENT);
    if (!e.boss && e.type !== "parasite") e.x += Math.sign(e.x + e.w / 2 - cx || J.dir) * COMPETENCE.RECUL;
  }
  if (drain && vole > 0) { const soin = Math.round(vole * 0.4); J.pv = Math.min(J.pvMax, J.pv + soin); nombre(cx, J.y - 8, "+" + soin + " PV", "#c9b0ff"); }
}

function appliquerElement(e, dmg) { appliquerElementType(e, ELEMENT_ACTIF, dmg); }

// Applique l'effet d'un élément (voir EFFETS_ELEMENTS) à un ennemi touché
function appliquerElementType(e, el, dmg = 0) {
  const F = EFFETS_ELEMENTS[el];
  if (!F || e.mort) return;
  if (e.element && e.element === el) return;   // un ennemi de feu ne brûle pas, un ennemi de foudre ne se paralyse pas
  if (e.spectre && F.spectresImmunises && !(e.materialise > 0)) { immunise(e); return; }
  const coul = COUL_ELEMENT[el];
  if (F.effet === "brulure") {
    e.brulure = F.duree || 3; e.brulureDps = F.degatsParSec || 0; e.brulureCoul = coul;
  } else if (F.effet === "cumul") {
    e.poison.doses = Math.min(F.cumulMax || 5, e.poison.doses + 1);
    e.poison.t = F.duree || 5; e.poison.dps = F.degatsParSec || 0; e.poison.coul = coul;
  } else if (F.effet === "paralysie") {
    if (F.degatsBonus) infligerDegats(e, F.degatsBonus, false, true);
    if (e.mort) return;
    e.jauge++; e.jaugeMax = F.coupsPourParalyser || 3; e.jaugeCoul = coul;
    if (e.jauge >= e.jaugeMax) { e.jauge = 0; e.paralyse = e.boss ? 0.6 : (F.dureeParalysie || 1); nombre(e.x + e.w / 2, e.y - 10, "PARALYSÉ", coul); }
  } else if (F.effet === "ralentir") {
    e.ralenti = F.duree || 3; e.ralentiForce = Math.max(0, Math.min(0.9, F.force || 0.5)); e.ralentiCoul = coul;
  } else if (F.effet === "volDeVie") {
    J.vol = (J.vol || 0) + dmg * (F.part || 0);
    if (J.vol >= 1) { const soin = Math.floor(J.vol); J.vol -= soin; J.pv = Math.min(J.pvMax, J.pv + soin); nombre(J.x + J.w / 2, J.y - 8, "+" + soin, coul); }
  }
}

function infligerDegats(e, dmg, fort, discret, source) {
  if (e.mort || e.dormant > 0 || e.intangible) return 0;
  if (e.type === "faux404") { // un faux double disparaît au premier coup
    e.mort = true; nombre(e.x + e.w / 2, e.y - 6, "FICHIER FANTÔME", "#2af5ff");
    for (let i = 0; i < 16; i++) particule(e.x + e.w / 2, e.y + e.h / 2, rnd(-70, 70), rnd(-70, 30), i % 2 ? "#ff2a6d" : "#2af5ff", 0.5);
    return 0;
  }
  if (e.bouclier) { e.fissures = Math.min(6, (e.fissures || 0) + 1); if (e.immuTxt <= 0) { nombre(e.x + e.w / 2, e.y - 6, "BOUCLIER", C.menthe); e.immuTxt = 0.5; } return 0; }
  if (e.immunite > 0) return 0;
  dmg *= 1 - e.defense;
  if (e.vulnerable > 0) dmg *= 2;
  if (e.marque > 0) dmg *= 1.1;                          // marqué par le Heaume corrompu
  if (e.paralyse > 0 && synergie("kernel")) dmg *= 2;     // synergie Bris de glace
  if (JOUEUR.ONE_SHOT) dmg = e.pv;
  e.pv -= dmg; e.flash = 0.1;
  if (!discret || dmg >= 1) nombre(e.x + e.w / 2, e.y - 6, String(Math.round(dmg)), fort ? "#ffd84d" : "#ffffff");
  for (let i = 0; i < (fort ? 12 : 5); i++) particule(e.x + e.w / 2, e.y + e.h / 2, rnd(-70, 70), rnd(-80, 10), Math.random() < 0.5 ? C.veineVive : "#ffd84d", 0.4);
  if (e.boss === "archonte" && !e.coupFinal) { // le Tyran : il fuit sans le Ver Ultime, sinon le Ver l'achève
    if ((!J.verUltime || souvenir) && e.pv <= e.pvMax * 0.15) { e.pv = e.pvMax * 0.15; tyranFuit(e); return dmg; }
    if (J.verUltime && !souvenir && e.pv <= 0) { e.pv = 1; coupDeGrace(e); return dmg; }
  }
  if (e.pv <= 0) {
    if (e.revie) { // Processus Zombie : « kill -9 » raté, il se relève une fois
      e.revie = false; e.pv = e.pvMax * 0.3; e.immunite = 1; secousse = 0.3;
      nombre(e.x + e.w / 2, e.y - 12, "KILL -9 ÉCHOUÉ !", C.corail, 1.4);
      return dmg;
    }
    if (e.type === "orphelin" && source !== "competence" && bossVivant()) { // il redémarre… sauf s'il est fini à la compétence
      e.pv = 0; e.dormant = 2.5; nombre(e.x + e.w / 2, e.y - 6, "REDÉMARRAGE...", "#c9b0ff");
      return dmg;
    }
    tuerEnnemi(e);
  }
  return dmg;
}

function tuerEnnemi(e) {
  e.mort = true;
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  for (let i = 0; i < 22; i++) particule(cx, cy, rnd(-90, 90), rnd(-110, 20), Math.random() < 0.5 ? C.veineVive : "#c9b0ff", 0.7);
  if (e.type === "parasite") {
    effets = effets.filter(x => !(x.def.drapeaux && x.def.drapeaux.includes("parasite")));
    nombre(cx, e.y - 8, "PARASITE DÉTRUIT", C.menthe);
    return;
  }
  tues++;
  if (e.boss) { bossVaincu(e); return; }
  gagnerXP(Math.round((XP_ENNEMIS[e.type] || 4) * (e.element ? 1.5 : 1)));   // un ennemi élémentaire rapporte plus
  if (e.minion && e.type !== "ver" && e.type !== "glitch") return;
  gagnerFragments(e.type === "trojan" || e.type === "zombie" ? 2 : 1);
  if (Math.random() < LOOT.CHANCE_OBJET * (armeDef().effet === "minage" ? 2 : 1)) lacherObjet(objetAuHasard(nivDeProfondeur(salle)), cx);
  if (Math.random() < LOOT.CHANCE_FIOLE) fioles.push({ x: cx - 2, y: cy, w: 5, h: 7, vy: -80 });
  if (aEffet("explosifs")) explosions.push({ x: cx, y: cy, t: 0, delai: 0.45, r: 20, faite: false });
}

// ---------- Comportement des ennemis ----------
function majEnnemi(e, dt) {
  e.t += dt; e.flash -= dt; e.immuTxt -= dt; e.immunite = (e.immunite || 0) - dt; e.marque = (e.marque || 0) - dt; e.materialise = Math.max(0, (e.materialise || 0) - dt);
  if (e.brulure > 0 || e.poison.t > 0) {
    e.tickDot -= dt;
    if (e.tickDot <= 0) {
      e.tickDot = 0.5;
      let d = 0;
      if (e.brulure > 0) d += (e.brulureDps || 0) * 0.5;
      if (e.poison.t > 0) d += (e.poison.dps || 0) * e.poison.doses * 0.5;
      if (d > 0) infligerDegats(e, d, false, true);
    }
    if (e.brulure > 0 && Math.random() < 0.4) particule(e.x + rnd(0, e.w), e.y + e.h, rnd(-8, 8), rnd(-45, -20), e.brulureCoul || COUL_ELEMENT.aucun, 0.5);
    if (e.poison.t > 0 && Math.random() < 0.25) particule(e.x + rnd(0, e.w), e.y + e.h / 2, rnd(-6, 6), rnd(-25, -10), e.poison.coul || COUL_ELEMENT.aucun, 0.6);
  }
  e.brulure -= dt; e.poison.t -= dt;
  if (e.poison.t <= 0) e.poison.doses = 0;
  if (e.mort) return;
  if (e.ralenti > 0) { // élément « ralentir » : l'ennemi vit au ralenti (moitié moins fort sur les boss)
    e.ralenti -= dt;
    dt *= 1 - e.ralentiForce * (e.boss ? 0.5 : 1);
    if (Math.random() < 0.2) particule(e.x + rnd(0, e.w), e.y + rnd(0, e.h), rnd(-5, 5), rnd(5, 15), e.ralentiCoul, 0.5);
  }
  if (e.paralyse > 0) {
    e.paralyse -= dt;
    if (Math.random() < 0.3) particule(e.x + rnd(0, e.w), e.y + rnd(0, e.h), rnd(-30, 30), rnd(-30, 30), COUL_ELEMENT.foudre, 0.2);
    return;
  }
  if (e.boss) { majBoss(e, dt); return; }
  if (e.retourne > 0) { majRetourne(e, dt); return; }
  const jc = cibleX(), ec = e.x + e.w / 2, dx = jc - ec, dist = Math.abs(dx);

  switch (e.type) {
    case "bot": { // tourne autour de Nexi, puis fonce sur lui
      e.chrono -= dt;
      if (e.etat === "normal") {
        const a = e.t * 2.5 + e.angle, tx = jc + Math.cos(a) * 30, ty = J.y + 10 + Math.sin(a) * 18;
        e.x += (tx - e.x) * Math.min(1, dt * 3); e.y += (ty - e.y) * Math.min(1, dt * 3);
        if (e.chrono <= 0) { e.etat = "fonce"; const an = Math.atan2(J.y + 12 - e.y, jc - e.x); e.vx = Math.cos(an) * 120; e.vy = Math.sin(an) * 120; e.chrono = 0.5; }
      } else { e.x += e.vx * dt; e.y += e.vy * dt; if (e.chrono <= 0) { e.etat = "normal"; e.chrono = rnd(1.5, 2.5); } }
      e.y = clamp(e.y, 4, SOL - e.h);
      break;
    }
    case "orphelin": { // petit processus fantôme qui redémarre tant qu'on ne le finit pas à la compétence
      if (e.dormant > 0) { e.dormant -= dt; if (e.dormant <= 0) e.pv = e.pvMax; return; }
      e.dir = Math.sign(dx) || e.dir; e.x += e.dir * 20 * dt; e.y = e.baseY - 4 + Math.sin(e.t * 3) * 3;
      break;
    }
    case "faux404": { e.y = e.baseY + Math.sin(e.t * 3 + 1) * 3; e.vie -= dt; if (e.vie <= 0) e.mort = true; return; }
    case "ver": { // glisse vite au sol : il faut sauter ou frapper accroupi
      if (Math.random() < dt * 0.8 || dist > 110) e.dir = Math.sign(dx) || e.dir;
      e.x += e.dir * e.vitesse * (dist < 90 ? 1.6 : 1) * dt;
      if (e.x <= 0 || e.x >= MONDE.LARGEUR_SALLE - e.w) e.dir *= -1;
      break;
    }
    case "glitch": { // vol erratique, attaques en piqué
      e.dir = Math.sign(dx) || e.dir;
      if (e.etat === "normal") {
        e.x += (Math.cos(e.t * 1.6) * e.vitesse + Math.sign(dx) * 12) * dt;
        e.y = e.baseY + Math.sin(e.t * 2.2) * 10;
        e.minuteur -= dt;
        if (e.minuteur <= 0 && dist < 130) {
          const a = Math.atan2(J.y + 12 - (e.y + e.h / 2), dx);
          e.vx = Math.cos(a) * e.vitesse * 3.6; e.vy = Math.sin(a) * e.vitesse * 3.6; e.etat = "pique"; e.chrono = 0.9;
        }
      } else if (e.etat === "pique") {
        e.x += e.vx * dt; e.y += e.vy * dt; e.chrono -= dt;
        if (e.chrono <= 0 || e.y + e.h >= SOL - 1) e.etat = "remonte";
      } else {
        e.y += (e.baseY - e.y) * Math.min(1, dt * 2.5);
        if (Math.abs(e.y - e.baseY) < 2) { e.etat = "normal"; e.minuteur = rnd(2, 3.4); }
      }
      e.y = Math.min(e.y, SOL - e.h);
      break;
    }
    case "script": { // garde ses distances et tire des lignes de code (s'accroupir pour esquiver)
      e.dir = Math.sign(dx) || e.dir;
      if (dist < 70) e.x -= e.dir * e.vitesse * dt; else if (dist > 130) e.x += e.dir * e.vitesse * dt;
      e.minuteur -= dt;
      if (e.minuteur <= 0 && dist < 180) { e.minuteur = e.def.cadenceTir; e.charge = 0.4; }
      if (e.charge > 0) {
        e.charge -= dt;
        if (e.charge <= 0) projectiles.push({ x: e.dir > 0 ? e.x + e.w : e.x - 10, y: SOL - 22, w: 10, h: 3, vx: e.dir * 95, vy: 0, degats: e.degats, vie: 3 });
      }
      break;
    }
    case "spyware": { // pose des pièges qui ralentissent
      e.x += e.dir * e.vitesse * dt;
      if (e.x < 20 || e.x > MONDE.LARGEUR_SALLE - 50 || Math.random() < dt * 0.3) e.dir *= -1;
      e.minuteur -= dt;
      if (e.minuteur <= 0) { e.minuteur = e.def.cadencePiege; pieges.push({ x: ec - 4, y: SOL - 3, w: 8, h: 3, vie: 8 }); }
      break;
    }
    case "drone": { // stationne en hauteur et tire un filin d'énergie vers le bas
      e.y = e.baseY + Math.sin(e.t * 2) * 3;
      if (e.etat === "normal") {
        const cible = jc - e.w / 2;
        if (Math.abs(cible - e.x) > 4) e.x += Math.sign(cible - e.x) * e.vitesse * dt;
        e.minuteur -= dt;
        if (e.minuteur <= 0 && dist < 120) { e.etat = "vise"; e.chrono = 0.7; }
      } else if (e.etat === "vise") {
        e.chrono -= dt;
        if (e.chrono <= 0) { e.etat = "tir"; e.chrono = 0.25; }
      } else {
        e.chrono -= dt;
        const rayon = { x: ec - 3, y: e.y + e.h, w: 6, h: SOL - (e.y + e.h) };
        if (chevauche(rayon, corpsJoueur())) blesserJoueur(e.degats, ec, e.element);
        if (e.chrono <= 0) { e.etat = "normal"; e.minuteur = e.def.cadenceTir; }
      }
      break;
    }
    case "zombie": { // spectre lent et flottant
      e.dir = Math.sign(dx) || e.dir;
      e.x += e.dir * e.vitesse * dt;
      e.y = e.baseY - 2 + Math.sin(e.t * 2) * 2;
      break;
    }
    case "trojan": { // imposant : arme son coup puis frappe lourdement
      if (e.etat === "normal") {
        e.dir = Math.sign(dx) || e.dir;
        if (dist > 22) e.x += e.dir * e.vitesse * dt; else { e.etat = "arme"; e.chrono = 0.65; }
      } else if (e.etat === "arme") {
        e.chrono -= dt;
        if (e.chrono <= 0) { e.etat = "frappe"; e.chrono = 0.2; e.aFrappe = false; }
      } else if (e.etat === "frappe") {
        e.chrono -= dt;
        const hb = { x: e.dir > 0 ? e.x + e.w : e.x - 22, y: e.y + 4, w: 22, h: e.h - 4 };
        if (!e.aFrappe && chevauche(hb, corpsJoueur())) { blesserJoueur(e.degats, ec, e.element); e.aFrappe = true; }
        if (e.chrono <= 0) { e.etat = "repos"; e.chrono = 0.8; }
      } else { e.chrono -= dt; if (e.chrono <= 0) e.etat = "normal"; }
      break;
    }
    case "parasite": { // s'accroche à Nexi : -25 % de dégâts et vol de PV
      const cx = J.x + J.w / 2 - J.dir * 12, cy = J.y - 10;
      e.x += (cx - e.w / 2 - e.x) * Math.min(1, dt * 3);
      e.y += (cy - e.y) * Math.min(1, dt * 3);
      e.minuteur -= dt;
      if (e.minuteur <= 0) { e.minuteur = 2; perdrePV(2); nombre(J.x + J.w / 2, J.y - 4, "-2", C.veineVive); }
      break;
    }
  }
  e.x = clamp(e.x, 0, MONDE.LARGEUR_SALLE - e.w);
  if (e.element && Math.random() < 0.35) particule(e.x + rnd(0, e.w), e.y + rnd(0, e.h), rnd(-8, 8), rnd(-30, -10), e.element === "feu" ? (Math.random() < 0.5 ? "#ff8a3c" : "#ffd84d") : (Math.random() < 0.5 ? "#2af5ff" : "#ffffff"), 0.35);
  if (e.type !== "parasite" && e.type !== "drone" && chevauche(e, corpsJoueur())) blesserJoueur(e.degats * (e.type === "trojan" ? 0.4 : 1), ec, e.element);
}

// ---------- Dégâts reçus par Nexi ----------
function blesserJoueur(dmg, sourceX, element) {
  if (J.invul > 0 || J.invisible > 0 || etat !== "jeu") return;
  if (element === "feu") { J.brule = 2.5; nombre(J.x + J.w / 2, J.y - 14, "BRÛLÉ", "#ff8a3c"); }          // brûlure : quelques PV en plus

// ---------- Mise à jour du joueur ----------
function majJoueur(dt) {

    if (J.tBrule >= 0.8) { J.tBrule = 0; perdrePV(2); nombre(J.x + J.w / 2, J.y - 4, "-2", "#ff8a3c"); }

    if (gravSigne > 0 && touches.bas && J.y + J.h < SOL - 1) { J.traverse = 0.25; J.y += 2; J.auSol = false; }
    else if (!J.accroupi) { J.vy = -JOUEUR.FORCE_SAUT * gravSigne; J.auSol = false; son("saut"); }
  }

  } else if (J.y + J.h >= SOL) { J.y = SOL - J.h; J.vy = 0; J.auSol = true; }
  else if (J.vy >= 0 && J.traverse <= 0) for (const p of plateformes) {
    if (J.x + J.w > p.x && J.x < p.x + p.w && ancienBas <= p.y + 0.5 && J.y + J.h >= p.y) { J.y = p.y - J.h; J.vy = 0; J.auSol = true; break; }
  }
  // Attaques : chaque catégorie d'arme a son style, et la compétence

  if (!J.atk && !fige && appui.leger && J.cdL <= 0) {

function dureeCooldownLourd() { return (J && J.virus ? VIRUS[J.virus].cooldown : COMPETENCE.COOLDOWN) * multEffets("cooldownLourd") / multEffets("cadence") * (J ? effetCharge().recharge : 1); }

// ---------- Gardien allié et orage ----------
function majAllies(dt) {
  if (aEffet("gardien") && !gardien) gardien = { x: J.x - 10, y: J.y - 14, cd: 1, t: 0 };
  if (!aEffet("gardien")) gardien = null;
  if (gardien) {
    const gd = gardien;
    gd.t += dt;
    gd.x += (J.x + J.w / 2 - J.dir * 14 - gd.x) * Math.min(1, dt * 4);
    gd.y += (J.y - 8 + Math.sin(gd.t * 3) * 2 - gd.y) * Math.min(1, dt * 4);
    gd.cd -= dt;
    if (gd.cd <= 0) {
      let cible = null, meilleur = 85;
      for (const e of ennemis) {
        if (e.mort || e.type === "parasite") continue;
        const d = Math.hypot(e.x + e.w / 2 - gd.x, e.y + e.h / 2 - gd.y);
        if (d < meilleur) { meilleur = d; cible = e; }
      }
      if (cible) {
        const a = Math.atan2(cible.y + cible.h / 2 - gd.y, cible.x + cible.w / 2 - gd.x);
        projAllies.push({ x: gd.x - 1, y: gd.y - 1, w: 3, h: 3, vx: Math.cos(a) * 140, vy: Math.sin(a) * 140, degats: 8, vie: 1.2 });
        gd.cd = 1.1;
      } else gd.cd = 0.3;
    }
  }
  for (const p of projAllies) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vie -= dt;
    for (const e of ennemis) {
      if (e.mort || p.vie <= 0) continue;
      if (chevauche(p, e)) { p.vie = 0; toucherAllie(e, p.degats); }
    }
  }
  projAllies = projAllies.filter(p => p.vie > 0);
  if (aEffet("foudreAuto")) {
    tFoudreAuto -= dt;
    if (tFoudreAuto <= 0) {
      tFoudreAuto = 5;
      const visibles = ennemis.filter(e => !e.mort && e.type !== "parasite" && e.x + e.w > camX && e.x < camX + VW);
      if (visibles.length) {
        const e = visibles[Math.floor(Math.random() * visibles.length)];
        eclairs.push({ x: e.x + e.w / 2, yBas: e.y + e.h / 2, t: 0.3 });

/* ==================================================================

let butins = [], coffresSalle = [], tirs = [], ondesJoueur = [], menu = null, terminal = null;

// ---------- Objets ----------
function creerObjet(id, niv, element) {

  if (element) o.element = element;   // arme enchantée : "feu" ou "foudre"

}
const NOMS_ELEMENTS = { feu: "DE FEU", foudre: "DE FOUDRE" };
const defObjet = (o) => (o.type === "arme" ? ARMES[o.id] : ARMURES[o.id]);
const nivDeProfondeur = (n) => 1 + Math.floor((n - 1) / LOOT.NIVEAU_TOUTES_LES);   // le niveau du butin trouvé
function nomObjet(o) { return defObjet(o).nom + (o.element ? " " + NOMS_ELEMENTS[o.element] : "") + " NV" + o.niv; }
function statObjet(o) { const d = defObjet(o); return o.type === "arme" ? d.degats + d.gain * (o.niv - 1) : d.defense + d.gain * (o.niv - 1); }

  const id = liste[Math.floor(Math.random() * liste.length)];

  const enchantee = ARMES[id] && !ARMES[id].element && Math.random() < LOOT.CHANCE_ELEMENT;

// ---------- Ce que l'équipement change ----------
const armeDef = () => ARMES[J.arme.id];

const xpPourNiveau = (n) => PROGRESSION_NEXI.XP_PREMIER_NIVEAU + PROGRESSION_NEXI.XP_EN_PLUS_PAR_NIVEAU * (n - 1);

function ouvrirMenu(m) {

  menu = Object.assign({ page: 0, sel: 0, etatAvant: avant }, m); etat = "menu";
}
function fermerMenu() {
  const r = menu && menu.aLaFermeture, avant = menu ? menu.etatAvant : "jeu"; menu = null; etat = avant || "jeu";
  if (etat === "jeu" && salleInfo && salleInfo.type === "terminal" && !souvenir) photoEtSauvegarde(); // niveaux et équipement choisis au Terminal
  if (r) r();
}
const PAS_LIGNE = 11;                                                        // hauteur d'une ligne de menu
// où commencent les lignes : sous le titre et les sous-titres (qui peuvent prendre 2 lignes chacun)
function debutLignes() {
  const n = (menu.sous ? couperTexte(menu.sous, VW - 8).length : 0) + (menu.info ? couperTexte(menu.info, VW - 8).length : 0);
  return 16 + 8 * Math.max(2, n);
}
const lignesParPage = () => Math.max(3, Math.floor((VH - debutLignes() - 15) / PAS_LIGNE)); // autant que l'écran le permet
function lignesVisibles() {
  const n = lignesParPage(), l = menu.lignes;
  if (l.length <= n) return l;
  const parPage = n - 1, debut = menu.page * parPage, vis = l.slice(debut, debut + parPage);
  vis.push({ txt: "PAGE SUIVANTE >", c: "#8b7fc0", action: () => { menu.page = (menu.page + 1) % Math.ceil(l.length / parPage); menu.sel = 0; } });
  return vis;
}
function zoneLigne(i) {
  if (menu.qr) { const d = dispositionQR(); return { x: d.xd, y: d.yl + i * 13, w: VW - d.xd - 6, h: 12 }; }
  const w = Math.min(VW - 20, 250); return { x: Math.round(VW / 2 - w / 2), y: debutLignes() + i * PAS_LIGNE, w, h: PAS_LIGNE - 1 };
}
function dispositionQR() { // le QR à gauche, le code et les boutons à droite
  const n = menu.qr.length, k = Math.max(1, Math.floor((VH - 22) / (n + 8))), t = (n + 8) * k, xd = 8 + t + 8;
  const parLigne = Math.max(8, Math.floor((VW - xd - 6) / 4)), lignes = [];
  for (const mot of menu.code.split("-")) {
    const l = lignes.length - 1;
    if (l >= 0 && (lignes[l] + "-" + mot).length <= parLigne) lignes[l] += "-" + mot; else lignes.push(mot);
  }
  return { k, t, xd, lignes, yl: 22 + lignes.length * 8 + 12 };
}
function dessinerMenu() {
  g.fillStyle = "rgba(5,1,12,0.88)"; g.fillRect(0, 0, VW, VH);   // le jeu est en pause derrière
  if (menu.qr) { // écran du code de sauvegarde
    const d = dispositionQR();
    dessinerQR(menu.qr, 8, 14, d.k);
    texte(menu.titre, d.xd, 8, menu.couleur, C.encre);
    d.lignes.forEach((l, i) => texte(l, d.xd, 22 + i * 8, "#e8e2ff", C.encre));
    if (menu.info) texte(menu.info, d.xd, 22 + d.lignes.length * 8 + 2, C.menthe, C.encre);
  } else {
    texteCentre(menu.titre, VW / 2, 6, menu.couleur || "#ffd84d", C.encre);
    let y = 15;   // les sous-titres trop longs passent sur deux lignes
    for (const l of menu.sous ? couperTexte(menu.sous, VW - 8) : []) { texteCentre(l, VW / 2, y, "#c9b0ff", C.encre); y += 8; }
    for (const l of menu.info ? couperTexte(menu.info, VW - 8) : []) { texteCentre(l, VW / 2, y, "#8b7fc0", C.encre); y += 8; }
  }
  lignesVisibles().forEach((l, i) => {
    const r = zoneLigne(i), actif = i === menu.sel;
    rect(r.x, r.y, r.w, r.h, actif ? "#3a2a6a" : "#1d1236"); rect(r.x, r.y, 2, r.h, l.c || C.menthe);
    if (l.curseur) { dessinerLigneCurseur(l, r); return; }
    if (l.icone) g.drawImage(l.icone, r.x + 5, r.y + Math.round((r.h - l.icone.height) / 2));
    texte(l.txt, r.x + (l.icone ? 19 : 6), r.y + 3, l.inactif ? "#5a5080" : (l.c || "#e8e2ff"));
    if (l.droite) texte(l.droite, r.x + r.w - 4 - largeurTexte(l.droite), r.y + 3, "#8b7fc0");
  });
  const sel = lignesVisibles()[menu.sel];
  if (sel && sel.aide) { const l = couperTexte(sel.aide, VW - 8).slice(0, 2); l.forEach((t, i) => texteCentre(t, VW / 2, VH - 6 - 7 * (l.length - i), "#c9b0ff", C.encre)); }
}
function activerLigne(i) { const l = lignesVisibles()[i]; if (l && !l.inactif && l.action) { son("menu"); l.action(); } }
function toucherMenu(lx, ly) {
  // on cherche d'abord la ligne touchée, puis on l'active une seule fois (l'action peut fermer le menu)
  const i = lignesVisibles().findIndex((l, k) => { const r = zoneLigne(k); return lx >= r.x && lx < r.x + r.w && ly >= r.y && ly < r.y + r.h; });
  if (i < 0) return;
  menu.sel = i;
  const l = lignesVisibles()[i];
  if (l.curseur && lx >= zoneBarre(zoneLigne(i)).x - 4) { menu.glisse = i; reglerCurseur(i, lx); }   // sur la barre
  else activerLigne(i);                                                                             // sur le haut-parleur
}
function clavierMenu(code) {
  const n = lignesVisibles().length;
  if (code === "ArrowDown" || code === "KeyS") menu.sel = (menu.sel + 1) % n;
  else if (code === "ArrowUp" || code === "KeyW" || code === "KeyZ") menu.sel = (menu.sel - 1 + n) % n;
  else if (code === "Enter" || code === "Space" || code === "KeyJ") activerLigne(menu.sel);
  else if (["ArrowLeft", "ArrowRight", "KeyA", "KeyQ", "KeyD"].includes(code)) { // régler une barre au clavier
    const l = lignesVisibles()[menu.sel];
    if (l && l.curseur) l.curseur.ecrire(l.curseur.lire() + (code === "ArrowRight" || code === "KeyD" ? 0.05 : -0.05));
  }
  else if (code === "Escape" || code === "Backspace") { if (menu.retour) menu.retour(); else fermerMenu(); }
}

// ---------- Les tirs de Nexi (arcs et bâtons) ----------
function tirer() {
  son("tir");
  const d = armeDef(), x = J.x + J.w / 2 + J.dir * 8, y = J.y + 11 + (d.effet === "spoof" ? Math.round(rnd(-4, 4)) : 0);

}
function majTirs(dt) {

    else if (t.sort) { disque(Math.round(t.x + 2 - ox), Math.round(t.y + 2 - oy), 2, c); px(t.x + 2 - ox, t.y + 2 - oy, "#ffffff"); }

// Un coup d'arme touche un ennemi (épée, fouet, masse ou projectile)
function toucherAvecArme(e, final, dmg, el) {
  if (e.dormant > 0 || e.intangible) return;
  const d = armeDef(), zero = d.effet === "zeroday";
  const magique = elementMagique(el);

  }
  if (!zero && e.boss === "e404" && !final && !magique) { immunise(e); return; }
  if (zero) { const def = e.defense; e.defense = 0; infligerDegats(e, dmg, final); e.defense = def; perdrePV(1); }
  else infligerDegats(e, dmg, final);

  appliquerElementType(e, el, dmg);
  if (e.mort) return;
  if (d.effet === "chaine") J.chaine = (J.chaine || 0) + 1;
  if (aEffetArmure("marque")) e.marque = 4;
  if (aEffetArmure("explosion") && Math.random() < 0.15) explosionCorrompue(e.x + e.w / 2, e.y + e.h / 2, dmg * 0.5);

  if (!e.boss && e.type !== "trojan" && e.type !== "parasite") e.x += J.dir * (final ? 10 : 3);

}
function explosionCorrompue(x, y, dmg) {
  son("explosion");

}
function majOndesJoueur(dt) { // ondes du Marteau Disque dur
  for (const o of ondesJoueur) {

    for (const e of ennemis) if (!e.mort && !o.touches.has(e) && e.y + e.h >= SOL - 8 && Math.abs(e.x + e.w / 2 - o.x) < e.w / 2 + 3) { o.touches.add(e); infligerDegats(e, o.dmg, false); }
  }

}

// Un ennemi piraté par le Lien Malveillant attaque ses propres alliés
function majRetourne(e, dt) {
  e.retourne -= dt;
  let c = null, m = 999;
  for (const o of ennemis) {
    if (o === e || o.mort || o.boss || o.type === "parasite" || o.type === "faux404") continue;
    const d = Math.abs(o.x - e.x); if (d < m) { m = d; c = o; }

    e.dir = Math.sign(c.x - e.x) || e.dir; e.x += e.dir * 40 * dt;
    e.cdRet = (e.cdRet || 0) - dt;

  }
  e.x = clamp(e.x, 0, MONDE.LARGEUR_SALLE - e.w);
  if (Math.random() < 0.3) particule(e.x + rnd(0, e.w), e.y, rnd(-10, 10), -20, "#c9b0ff", 0.3);
}

// ---------- Mode démo : on rattrape la progression des salles sautées ----------
function rattrapage(depuis, jusqua) {
  let xp = 0, frag = 0;
  for (let n = depuis + 1; n < jusqua; n++) {
    const i = infoSalle(n);
    if (i.type === "normal") {
      const comp = compositionSalle(n);
      xp += comp.reduce((s, t) => s + (XP_ENNEMIS[t] || 4), 0);
      frag += (comp.reduce((s, t) => s + (t === "trojan" || t === "zombie" ? 2 : 1), 0) + LOOT.CHANCE_COFFRE * 7.5) * bonusProfondeur(n);
    }
    else if (i.type === "miniboss") { xp += XP_ENNEMIS.boss; frag += 25 * bonusProfondeur(n); }
    else if (i.type === "archonte") { xp += XP_ENNEMIS.archonte; frag += 40 * bonusProfondeur(n); }
  }
  if (xp <= 0) return;
  const avant = J.niveau;
  frag = Math.round(frag);
  gagnerXP(xp, true); J.fragments += frag;
  const ordre = ["degats", "pv", "defense", "endurance", "vitesse"];
  let i = 0;
  while (J.points > 0) depenserPoint(ordre[i++ % ordre.length]);   // répartition automatique
  // les fragments sont dépensés comme le ferait un joueur : l'arme d'abord, puis les armures
  for (let encore = true; encore;) {
    encore = false;
    for (const o of [J.arme, J.armure.plastron, J.armure.casque, J.armure.bottes, J.armure.gantelets]) {
      if (o && J.fragments >= coutAmelioration(o)) { J.fragments -= coutAmelioration(o); o.niv++; encore = true; break; }
    }
  }
  majPvMax(); J.pv = J.pvMax;
  const msg = { titre: "RATTRAPAGE DU MODE DÉMO", sous: "Niveau " + avant + " -> " + J.niveau + ", arme niveau " + J.arme.niv + ", +" + frag + " fragments", couleur: "#ffd84d", t: 3.5 };
  if (introBoss) introBoss.banniere = msg; else banniere = msg;
}

const BASE32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";     // pas de I, L, O, U : on ne les confond pas

// La « photo » de la partie : tout ce qu'il faut pour la reprendre
function instantane() {

    sac: J.sac.map(copie), verUltime: !!J.verUltime, tyranVaincu: !!J.tyranVaincu,

// ---------- Transformer la sauvegarde en code NEXI-XXXX-XXXX-… ----------
const idsObjets = () => [...Object.keys(ARMES), ...Object.keys(ARMURES)];
function encoderSauvegarde() {
  const o = [], ids = idsObjets(), virus = Object.keys(VIRUS);
  const u8 = (n) => o.push(clamp(Math.round(n) || 0, 0, 255));
  const u16 = (n) => { n = clamp(Math.round(n) || 0, 0, 65535); o.push(n >> 8, n & 255); };

  const p = partieSauvee;

  u8((p ? 1 : 0) | (p && p.verUltime ? 2 : 0) | (p && p.tyranVaincu ? 4 : 0));
  u16(record); u16(fragmentsReserve);
  u8(Object.keys(NOMS_BOSS).reduce((m, b, i) => m | (bossVaincus.has(b) ? 1 << i : 0), 0));  // boss déjà battus
  const coffre = coffreDepot.slice(0, PROGRESSION_NEXI.TAILLE_COFFRE);
  u8(coffre.length); coffre.forEach(objet);
  if (p) {
    u16(p.salle); u16(p.tues); u8(p.niveau); u16(p.xp); u8(p.points);
    u8(p.stats.pv); u8(p.stats.degats); u8(p.stats.vitesse); u8(p.stats.defense); u8(p.stats.endurance || 0);
    u16(p.fragments); u8(p.pvRatio * 255); u8(p.virus ? virus.indexOf(p.virus) + 1 : 0);
    u8(p.virusConnus.reduce((m, v) => m | (1 << virus.indexOf(v)), 0));

function decoderSauvegarde(code) {
  let t = String(code).toUpperCase().replace(/^\s*NEXI/, "").replace(/[^0-9A-Z]/g, "").replace(/O/g, "0").replace(/[IL]/g, "1");
  let bits = "";

  if (o.length < 8) throw new Error("Code trop court");
  let pos = 0;
  const u8 = () => { if (pos >= o.length) throw new Error("Code incomplet"); return o[pos++]; };
  const u16 = () => (u8() << 8) | u8();

  if (version < 1 || version > 3) throw new Error("Version de sauvegarde inconnue");

  if (version >= 2) { const m = u8(); r.boss = Object.keys(NOMS_BOSS).filter((_, i) => m & (1 << i)); }
  const nc = u8(); for (let i = 0; i < nc; i++) { const x = objet(); if (x) r.coffre.push(x); }
  if (drapeaux & 1) {
    const p = { salle: Math.max(1, u16()), tues: u16(), niveau: Math.max(1, u8()), xp: u16(), points: u8(),
      stats: { pv: u8(), degats: u8(), vitesse: u8(), defense: u8(), endurance: 0 } };

  }

  if (u8() !== somme) throw new Error("Code abîmé : vérifie chaque caractère");
  return r;
}

// Rendu générique : formes → pixels, avec ombres et contour automatiques
function rendreFormes(L, Hh, formes, mats, decor) {

  for (const f of formes) {

    for (let y = 0; y < Hh; y++) for (let x = 0; x < L; x++) {
      let dedans = false;

      else if (f.t === "capsule") {

        const t = clamp(((x - f.x0) * dx + (y - f.y0) * dy) / Lc, 0, 1);
        dedans = Math.hypot(x - (f.x0 + t * dx), y - (f.y0 + t * dy)) <= f.r;
      } else if (f.t === "poly") {
        for (let i = 0, j = f.p.length - 1; i < f.p.length; j = i++) {

          if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) dedans = !dedans;
        }
      }
      if (dedans) g2[y * L + x] = f.m === "trou" ? null : f.m;
    }
  }
  const c = nouveauCanvas(L, Hh), cx = c.getContext("2d");
  const lire = (x, y) => (x < 0 || y < 0 || x >= L || y >= Hh) ? null : g2[y * L + x];
  for (let y = 0; y < Hh; y++) for (let x = 0; x < L; x++) {
    const m = lire(x, y);
    if (m === null) {
      if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => lire(x + a, y + b) !== null)) { cx.fillStyle = "#0d0818"; cx.fillRect(x, y, 1, 1); }

    }

  },
  // --- Botnet Enforcer ---
  ondes(e, dt) {

    if (passe(e, dt, 0.5) || passe(e, dt, 1.1)) ondeAuSol(e, e.degats * 0.7);
    return e.tA > 1.5;
  },
  appel(e, dt) {
    e.leve = e.tA < 0.4;
    if (passe(e, dt, 0.4)) for (let i = 0; i < 3; i++) { const b = invoquer("bot", e.x + e.w / 2); if (b) { b.angle = i * 2.1; b.y = e.y; } }
    return e.tA > 0.8;
  },
  canon(e, dt) {
    e.dir = Math.sign(cibleX() - (e.x + e.w / 2)) || e.dir;
    for (const t of [0.5, 0.75, 1.0]) if (passe(e, dt, t)) {
      e.recul = 0.1;
      projectiles.push({ x: e.dir > 0 ? e.x + e.w + 4 : e.x - 12, y: SOL - 24, w: 8, h: 3, vx: e.dir * 125, vy: 0, degats: e.degats * 0.6, vie: 4 });
    }

  },
  surcharge(e, dt) {
    e.rouge = e.tA < 1.3;
    if (e.rouge && Math.random() < 0.5) particule(e.x + rnd(0, e.w), e.y + rnd(0, e.h), rnd(-20, 20), rnd(-40, -10), "#ff4a3a", 0.4);
    if (passe(e, dt, 1.3)) explosions.push({ x: e.x + e.w / 2, y: e.y + e.h / 2, t: 0.45, delai: 0.45, r: 48, faite: false, dmg: e.degats * 1.2 });
    return e.tA > 1.6;
  },
  // --- Processus Zombie ---
  orphelins(e, dt) {
    e.bras = e.tA < 0.5;
    if (passe(e, dt, 0.5)) { invoquer("orphelin", e.x - 14); invoquer("orphelin", e.x + e.w + 6); e.materialise = 2.2; }
    return e.tA > 0.9;
  },
  etreinte(e, dt) {
    e.bras = e.tA < 0.5;
    if (passe(e, dt, 0.5)) e.dir = Math.sign(cibleX() - (e.x + e.w / 2)) || e.dir;
    if (e.tA >= 0.5 && e.tA < 1.2) {
      e.x += e.dir * 130 * dt;
      if (!e.aFrappe && chevauche(e, corpsJoueur())) {
        e.aFrappe = true;
        const d = 10 * MONSTRES.MULT_DEGATS;
        if (J.invul <= 0 && J.invisible <= 0) { blesserJoueur(d, e.x + e.w / 2); e.pv = Math.min(e.pvMax, e.pv + d); nombre(e.x + e.w / 2, e.y - 10, "+" + Math.round(d), "#c9b0ff"); }
      }
    }
    if (passe(e, dt, 1.2)) e.materialise = 2.5;
    return e.tA > 1.4;
  },
  chaines(e, dt) {
    e.bras = e.tA < 0.5;
    if (passe(e, dt, 0.5)) {
      const dir = Math.sign(cibleX() - (e.x + e.w / 2)) || e.dir;
      projectiles.push({ x: e.x + e.w / 2, y: SOL - 22, w: 10, h: 3, vx: dir * 110, vy: 0, degats: 5, vie: 4, chaine: true });
      e.materialise = 2;
    }
    return e.tA > 1.0;
  },
  // --- Erreur 404 ---
  pinces(e, dt) { // un tentacule de métal jaillit vers Nexi et claque sa pince
    if (!e.cibleP || passe(e, dt, 0.01)) { e.cibleP = { x: cibleX(), y: J.y + 12 }; e.ouvert = true; }
    const ox = e.x + e.w / 2, oy = e.y + e.h - 2;
    const tx = e.cibleP.x, ty = e.cibleP.y, maxi = 70;
    const d = Math.hypot(tx - ox, ty - oy) || 1, k = Math.min(1, maxi / d);
    const bx = ox + (tx - ox) * k, by = oy + (ty - oy) * k;
    let s = 0;
    if (e.tA < 0.45) s = 0.15 * (e.tA / 0.45);                 // il se tend (avertissement)
    else if (e.tA < 0.62) s = 0.15 + 0.85 * ((e.tA - 0.45) / 0.17); // il jaillit
    else if (e.tA < 0.8) s = 1;                                  // CLAC
    else s = Math.max(0, 1 - (e.tA - 0.8) / 0.3);               // il se rétracte
    e.pince = { x0: ox, y0: oy, x1: ox + (bx - ox) * s, y1: oy + (by - oy) * s, ferme: e.tA > 0.62 && e.tA < 0.8 };
    if (e.pince.ferme && !e.aFrappe && chevauche({ x: e.pince.x1 - 6, y: e.pince.y1 - 6, w: 12, h: 12 }, corpsJoueur())) { e.aFrappe = true; blesserJoueur(e.degats, e.pince.x1); }
    if (e.tA > 1.1) { e.pince = null; e.cibleP = null; e.ouvert = false; return true; }
    return false;
  },
  teleport(e, dt) {
    e.alpha = e.tA < 0.35 ? 1 - e.tA / 0.35 : Math.min(1, (e.tA - 0.35) / 0.35);
    e.intangible = e.tA < 0.5;
    if (passe(e, dt, 0.35)) { let x, essais = 0; do { x = rnd(20, MONDE.LARGEUR_SALLE - 50); } while (Math.abs(x - cibleX()) < 60 && essais++ < 20); e.x = x; }
    if (e.tA > 0.7) { e.alpha = 1; e.intangible = false; return true; }
    return false;
  },
  trous(e, dt) {
    for (const t of [0.3, 0.6, 0.9]) if (passe(e, dt, t)) trous.push({ x: clamp(cibleX() + rnd(-50, 50) - 7, 4, MONDE.LARGEUR_SALLE - 20), w: 14, vie: 7, dmg: e.degats * 0.6 });
    return e.tA > 1.1;
  },
  doubles(e, dt) {

      for (let i = 0; i < 20; i++) particule(e.x + e.w / 2, e.y + e.h / 2, rnd(-80, 80), rnd(-80, 80), Math.random() < 0.5 ? "#ff2a6d" : "#2af5ff", 0.4);
    }
    return e.tA > 0.8;
  },
  lien(e, dt) {

    }

  },
  // --- Kernel Panic ---
  gravite(e, dt) {
    if (passe(e, dt, 0.01)) nombre(e.x + e.w / 2, e.y - 14, "GRAVITÉ INSTABLE", "#4a88ff", 1.2);
    if (passe(e, dt, 0.8)) { gravSigne = -1; J.auSol = false; }

  },
  decharges(e, dt) {

  },
  ecranBleu(e, dt) {

  },
  epuise(e, dt) {

    if (Math.random() < 0.2) particule(e.x + rnd(0, e.w), e.y + rnd(0, 10), rnd(-10, 10), rnd(-20, -5), "#4a88ff", 0.5);
    return e.tA > 2.0;
  },
  // --- Rootkit Archonte ---
  chaine(e, dt, p2) {
    e.bras = e.tA < 0.8;

    if (p2 && passe(e, dt, 1.1)) rayons.push({ y: SOL - 6, h: 5, t: 0, tele: 0.6, actif: 0.3, dmg: e.degats, rouge: true });
    return e.tA > (p2 ? 2.1 : 1.2);
  },
  invocation(e, dt) {
    e.bras = e.tA < 0.5;

    return e.tA > 0.9;
  },
  frappe(e, dt) {
    if (e.tA < 0.3) e.dir = Math.sign(cibleX() - (e.x + e.w / 2)) || e.dir;
    if (e.tA < 0.6) e.x += e.dir * 30 * dt;
    e.bras = e.tA < 0.6;
    if (passe(e, dt, 0.6)) {
      ondeAuSol(e, e.degats * 0.8);
      const hb = { x: e.dir > 0 ? e.x + e.w : e.x - 30, y: e.y + 20, w: 30, h: e.h - 20 };
      if (chevauche(hb, corpsJoueur())) blesserJoueur(e.degats, e.x + e.w / 2);
      secousse = 0.3;
    }
    return e.tA > 1.1;
  },
};

function deplacementPause(e, dt, dx, dist) {
  switch (e.boss) {
    case "troie": // il ne se retourne pas tout seul : on peut passer dans son dos… gare à la ruade !
      if (Math.sign(dx) === e.dir && dist > 60) e.x += e.dir * 22 * dt;
      e.tDos = Math.sign(dx) !== e.dir && dist < 40 ? (e.tDos || 0) + dt : 0;
      if (e.tDos > 0.7) { e.etat = "ruade"; e.tA = 0; e.tDos = 0; e.aFrappe = false; }
      break;
    case "zombie":
      e.dir = Math.sign(dx) || e.dir; e.x += e.dir * 14 * dt; e.y = e.baseY - 3 + Math.sin(e.t * 2) * 3; break;
    case "e404":
      e.dir = Math.sign(dx) || e.dir; if (dist > 80) e.x += e.dir * 16 * dt; e.y = e.baseY + Math.sin(e.t * 3) * 3; break;
    default: // botnet, kernel, archonte
      e.dir = Math.sign(dx) || e.dir;
      if (dist > 70) e.x += e.dir * (e.boss === "kernel" ? 12 : 18) * dt; else if (dist < 34) e.x -= e.dir * 14 * dt;
      if (e.boss === "kernel") e.y = e.baseY + Math.sin(e.t * 2) * 2;
  }
}

function majBoss(e, dt) {
  if (majBossSpecial(e, dt)) return;
  auraBoss(e);
  e.flashBouclier = Math.max(0, (e.flashBouclier || 0) - dt);
  const dx = cibleX() - (e.x + e.w / 2), dist = Math.abs(dx), p2 = e.pv < e.pvMax * 0.5;
  e.vulnerable = Math.max(0, e.vulnerable - dt); e.materialise = Math.max(0, e.materialise - dt); e.recul = Math.max(0, (e.recul || 0) - dt);
  if (e.boss === "archonte") {
    if (p2 && !e.p2) { e.p2 = true; e.bouclier = true; banniere = { titre: "BOUCLIER TOTAL !", sous: "Utilise ta compétence près de lui pour le briser", couleur: C.menthe, t: 3.5 }; }
    if (e.p2 && !e.bouclier) { e.tBouclier -= dt; if (e.tBouclier <= 0) { e.bouclier = true; nombre(e.x + e.w / 2, e.y - 10, "BOUCLIER RÉACTIVÉ", C.menthe); } }
  }
  if (e.etat === "pause") {
    e.chrono -= dt;
    deplacementPause(e, dt, dx, dist);
    if (e.etat === "pause" && e.chrono <= 0) {
      const kit = KITS[e.boss].filter(a => a !== e.dernier);
      e.etat = kit[Math.floor(Math.random() * kit.length)]; e.tA = 0; e.aFrappe = false;
      if (e.boss === "troie" || e.boss === "archonte") e.dir = Math.sign(dx) || e.dir;
    }
  } else {
    e.tA += dt;
    if (ATTAQUES[e.etat](e, dt, p2)) {
      e.leve = e.bras = e.rouge = e.ventre = e.intangible = false; e.alpha = 1;
      if (e.boss === "kernel" && e.etat !== "epuise") { e.dernier = e.etat; e.etat = "epuise"; e.tA = 0; }
      else { if (e.etat !== "epuise") e.dernier = e.etat; e.etat = "pause"; e.chrono = (e.boss === "kernel" ? 0.6 : 1.4) * (p2 ? 0.6 : 1); }
    }
  }
  e.x = clamp(e.x, 0, MONDE.LARGEUR_SALLE - e.w);
  // zone de contact : le Cheval de Troie ne blesse qu'avec le bas du corps (on peut le sauter)
  const contact = e.boss === "troie" ? { x: e.x + 4, y: e.y + e.h - 24, w: e.w - 8, h: 24 } : e;
  if (!e.intangible && chevauche(contact, corpsJoueur())) blesserJoueur(e.degats * (e.etat === "ruee" && e.tA > 0.9 ? 1 : 0.5), e.x + e.w / 2);
  // les pas lourds des grands boss font trembler le sol
  if (e.etat === "pause" && (e.boss === "troie" || e.boss === "botnet" || e.boss === "archonte")) { e.tPas = (e.tPas || 0) + dt; if (e.tPas > 0.7) { e.tPas = 0; secousse = Math.max(secousse, 0.06); } }
}

function bossVaincu(e) {
  gravSigne = 1;
  for (const m of ennemis) if (m !== e && !m.mort && m.type !== "parasite") { m.mort = true; for (let i = 0; i < 6; i++) particule(m.x + m.w / 2, m.y + m.h / 2, rnd(-60, 60), rnd(-80, 10), C.veineVive, 0.5); }
  rayons = []; zones = []; colonnes = []; ondesSol = []; trous = []; projectiles = []; ecranBleuT = 0;
  secousse = 0.6;
  for (let i = 0; i < 70; i++) particule(e.x + e.w / 2, e.y + e.h / 2, rnd(-160, 160), rnd(-200, 40), [C.veineVive, "#ffd84d", "#ffffff", "#c9b0ff"][i % 4], 1.1);
  bossVaincus.add(e.boss);
  if (souvenir) { finSouvenirDans = 2.5; banniere = { titre: "SOUVENIR REVÉCU !", sous: "Retour à la salle de repos...", couleur: "#ffd84d", t: 2.5 }; return; }
  gagnerXP(e.boss === "archonte" ? XP_ENNEMIS.archonte : XP_ENNEMIS.boss);
  gagnerFragments(e.boss === "archonte" ? 40 : 25);
  lacherObjet(e.boss === "archonte" ? pieceCorrompueAuHasard(nivDeProfondeur(salle) + 1) : objetAuHasard(nivDeProfondeur(salle) + 1), e.x + e.w / 2 + 14);
  if (e.boss === "archonte") {
    J.pv = Math.min(J.pvMax, J.pv + J.pvMax * 0.3);
    banniere = { titre: e.nom + " EST ANÉANTI !", sous: "La corruption reflue...", couleur: "#ffd84d", t: 3 };
    if (!J.tyranVaincu) { J.tyranVaincu = true; victoireDans = 2; }
  } else {
    capsules.push({ x: e.x + e.w / 2 - 5, y: SOL - 16, w: 10, h: 14, virus: e.boss, t: 0 });
    banniere = { titre: "MINI-BOSS VAINCU !", sous: "Touche la capsule pour prendre le virus " + VIRUS[e.boss].nom, couleur: "#ffd84d", t: 4.5 };
  }
}

// ---------- Les virus ----------
function majPvMax() {
  J.pvMax = Math.round((JOUEUR.PV_MAX + (J.bonusPv || 0) + GAIN_PAR_POINT.pv * J.stats.pv) * (J.virus === "e404" ? 0.8 : 1) * (synergie("aucun") ? 1.15 : 1));
  J.pv = Math.min(J.pv, J.pvMax);
}
function equiperVirus(id) {
  J.virus = id; majPvMax(); J.cdH = 0;
  if (!J.virusConnus.includes(id)) J.virusConnus.push(id);
  const V = VIRUS[id];
  banniere = { titre: "VIRUS : " + V.nom, sous: V.effet + " / " + V.contre, couleur: "#c9b0ff", t: 4 };
  for (let i = 0; i < 30; i++) particule(J.x + J.w / 2, J.y + 15, rnd(-90, 90), rnd(-120, 20), i % 2 ? "#c9b0ff" : C.veineVive, 0.8);
}
function utiliserCompetence() {
  son("competence");
  const cx = J.x + J.w / 2;
  for (const e of ennemis) if (e.bouclier && Math.abs(e.x + e.w / 2 - cx) < 110) briserBouclier(e); // briser le bouclier du Tyran
  switch (J.virus) {
    case "troie":
      chevalT = 0.9; chevalX = cx + J.dir * 16;
      for (let i = 0; i < 4; i++) allies.push({ type: "mini", x: chevalX + rnd(-6, 6), y: SOL - 9, w: 7, h: 9, vie: 7, cd: rnd(0, 0.4), dir: J.dir, delai: 0.3 + i * 0.12 });
      break;
    case "botnet":
      for (let i = 0; i < 3; i++) allies.push({ type: "essaim", a: i * 2.09, x: J.x, y: J.y, w: 7, h: 7, vie: 8, cd: 0.5 + i * 0.2 });
      break;
    case "zombie": lancerOnde("drain"); break;
    case "e404": J.invisible = 2; J.leurreX = cx; nombre(cx, J.y - 8, "INTROUVABLE", "#c9b0ff"); break;
    case "kernel":
      ecranVirusT = 0.3; J.fige = 1;
      for (const e of ennemis) if (!e.mort) e.paralyse = Math.max(e.paralyse, e.boss ? 1.5 : 3);
      nombre(cx, J.y - 8, "ÉCRAN BLEU !", "#4a88ff");
      break;
    default: lancerOnde();
  }
}
function plusProche(x, y, max) {
  let c = null, m = max;
  for (const e of ennemis) {
    if (e.mort || e.dormant > 0 || e.type === "parasite" || e.type === "faux404") continue;
    const d = Math.hypot(e.x + e.w / 2 - x, e.y + e.h / 2 - y);
    if (d < m) { m = d; c = e; }
  }
  return c;
}
// Un allié touche un ennemi (mêmes règles que l'épée : les Spectres résistent)
function toucherAllie(e, dmg) {
  if (e.dormant > 0) return;
  if (e.boss === "e404") { immunise(e); return; }
  if (e.spectre && !(e.materialise > 0)) dmg *= 0.25;   // les Spectres résistent aussi aux alliés
  infligerDegats(e, dmg * degatsMultJoueur(), false);
}
function majAlliesVirus(dt) {
  for (const a of allies) {
    if (!(a.type === "essaim" && synergie("botnet"))) a.vie -= dt;  // synergie : l'essaim reste
    if (a.type === "mini") {
      if (a.delai > 0) { a.delai -= dt; continue; }
      const c = plusProche(a.x, a.y, 200);
      if (c) {
        a.dir = Math.sign(c.x + c.w / 2 - a.x) || a.dir;
        if (Math.abs(c.x + c.w / 2 - a.x) > 8) a.x += a.dir * 55 * dt;
        else { a.cd -= dt; if (a.cd <= 0) { a.cd = 0.5; toucherAllie(c, synergie("troie") ? degatsArme(false) * 0.5 : 5); } } // synergie : ils copient ton arme
      } else a.x += (J.x + J.w / 2 - a.x) * Math.min(1, dt * 2);
    } else {
      a.a += dt * 3;
      a.x = J.x + J.w / 2 + Math.cos(a.a) * 16 - 3; a.y = J.y + 6 + Math.sin(a.a) * 10;
      a.cd -= dt;
      if (a.cd <= 0) {
        const c = plusProche(a.x, a.y, 110);
        if (c) { const an = Math.atan2(c.y + c.h / 2 - a.y, c.x + c.w / 2 - a.x); projAllies.push({ x: a.x + 2, y: a.y + 2, w: 3, h: 3, vx: Math.cos(an) * 150, vy: Math.sin(an) * 150, degats: 5, vie: 1 }); a.cd = 0.7; }
        else a.cd = 0.2;
      }
    }
  }
  allies = allies.filter(a => a.vie > 0);
}

// ---------- Dangers posés par les boss ----------
function majDangers(dt) {
  const corps = corpsJoueur();
  for (const o of ondesSol) {
    o.x += o.dir * o.v * dt;
    if (!o.touche && gravSigne > 0 && chevauche({ x: o.x - 4, y: SOL - 7, w: 8, h: 7 }, corps)) { o.touche = true; blesserJoueur(o.dmg, o.x - o.dir * 10); }
  }
  ondesSol = ondesSol.filter(o => o.x > -10 && o.x < MONDE.LARGEUR_SALLE + 10);
  for (const r of rayons) {
    r.t += dt;
    if (r.t > r.tele && r.t < r.tele + r.actif && chevauche({ x: 0, y: r.y, w: MONDE.LARGEUR_SALLE, h: r.h }, corps)) blesserJoueur(r.dmg, J.x + J.w / 2 + 1);
  }
  rayons = rayons.filter(r => r.t < r.tele + r.actif);
  for (const z of zones) {
    z.t += dt;
    if (z.t > z.tele && z.t < z.tele + 0.25 && chevauche({ x: z.x, y: 0, w: z.w, h: SOL }, corps)) blesserJoueur(z.dmg, z.x + z.w / 2);

// ---------- Mise à jour générale ----------
function maj(dt) {
  if (victoireDans > 0) { victoireDans -= dt; if (victoireDans <= 0) { etat = "victoire"; tVic = 0; } }
  if (introBoss) { majIntro(dt); if (banniere) { banniere.t -= dt; if (banniere.t <= 0) banniere = null; } return; }
  majJoueur(dt);
  if (etat !== "jeu") return;
  for (const e of ennemis) { majEnnemi(e, dt); if (etat !== "jeu") return; }
  ennemis = ennemis.filter(e => !e.mort);
  majAllies(dt);
  majAlliesVirus(dt);
  majDangers(dt);
  majTirs(dt); majOndesJoueur(dt); majPiegesSalle(dt);
  majButins(dt); if (etat !== "jeu") return;
  majTerminal(); if (etat !== "jeu") return;
  majRollback(); if (etat !== "jeu") return;
  if (finSouvenirDans > 0) { finSouvenirDans -= dt; if (finSouvenirDans <= 0) { finSouvenir(); return; } }
  for (const p of projectiles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vie -= dt;
    if (p.vie > 0 && chevauche(p, corpsJoueur()) && J.invul <= 0 && J.invisible <= 0) {
      if (p.chaine) { J.immobile = 1.2; nombre(J.x + J.w / 2, J.y - 8, "ENCHAÎNÉ !", "#c9b0ff"); }
      blesserJoueur(p.degats, p.x); p.vie = 0;
    }
  }
  projectiles = projectiles.filter(p => p.vie > 0 && p.x > -20 && p.x < MONDE.LARGEUR_SALLE + 20);
  for (const p of pieges) {
    p.vie -= dt;
    if (p.vie > 0 && !aEffetArmure("bypass") && chevauche(p, corpsJoueur())) { J.lent = 2.5; p.vie = 0; nombre(J.x + J.w / 2, J.y - 8, "RALENTI", C.corail); }
  }
  pieges = pieges.filter(p => p.vie > 0);
  for (const f of fioles) {
    f.vy += MONDE.GRAVITE * dt; f.y += f.vy * dt;
    if (f.y + f.h > SOL) { f.y = SOL - f.h; f.vy = 0; }
    if (chevauche(f, corpsJoueur())) {
      f.prise = true;
      if (J.virus === "zombie") nombre(J.x + J.w / 2, J.y - 8, "DRAIN : AUCUN SOIN", "#c9b0ff");
      else { J.pv = Math.min(J.pvMax, J.pv + LOOT.SOIN_FIOLE); nombre(J.x + J.w / 2, J.y - 8, "+" + LOOT.SOIN_FIOLE + " PV", C.menthe); }
    }
  }
  fioles = fioles.filter(f => !f.prise);
  for (const x of explosions) {
    x.t += dt;
    if (!x.faite && x.t >= x.delai) {
      x.faite = true;
      for (let i = 0; i < 20; i++) particule(x.x, x.y, rnd(-100, 100), rnd(-100, 60), COUL_ELEMENT.feu, 0.5);
      if (Math.hypot(J.x + J.w / 2 - x.x, J.y + 15 - x.y) < x.r) blesserJoueur(x.dmg || 10 * MONSTRES.MULT_DEGATS, x.x);
      secousse = Math.max(secousse, 0.15);
    }
  }
  explosions = explosions.filter(x => x.t < x.delai + 0.3);
  for (const e of eclairs) e.t -= dt;
  eclairs = eclairs.filter(e => e.t > 0);
  for (const o of ondes) o.t += dt;
  ondes = ondes.filter(o => o.t < 0.35);
  majAutel();
  if (!porte.ouverte && !souvenir && ennemis.every(e => e.mort || e.type === "parasite") && !(salleInfo.type === "sanctuaire" && !J.verUltime)) {
    porte.ouverte = true; son("porte");
    nombre(porte.x + porte.w / 2, porte.y - 10, "PORTE OUVERTE : " + etiquetteSalle(salle + 1).type, C.menthe, 2.2);
  }
  if (porte.ouverte && chevauche(corpsJoueur(), porte)) {
    if (MODE_DEMO) { etat = "choixSalle"; choixSalles = Array.from({ length: 10 }, (_, i) => salle + 1 + i); J.x = porte.x - J.w - 4; }
    else if (J.pv < J.pvMax - 0.5 && infoSalle(salle + 1).type !== "terminal") { J.x = porte.x - J.w - 4; menuPorte(); }   // blessé : on propose un soin
    else salleSuivante();
  }
  if (banniere) { banniere.t -= dt; if (banniere.t <= 0) banniere = null; }
}

// ---------- Les pièges de salle ----------
function placerPieges(n) {
  const nb = 1 + Math.floor(Math.random() * PIEGES.MAX_PAR_SALLE), types = ["explosif", "brulant", "foudroyant"];
  const fDeg = Math.pow(1 + MONSTRES.GAIN_PAR_SALLE * 0.6, n - 1);   // ils font plus mal en profondeur
  for (let i = 0; i < nb; i++) {
    const type = types[Math.floor(Math.random() * types.length)], d = PIEGES[type];
    const w = type === "explosif" ? 10 : d.largeur;
    let x, essais = 0;
    do { x = Math.round(rnd(90, MONDE.LARGEUR_SALLE - 80)); essais++; }
    while (essais < 20 && piegesSalle.some(p => Math.abs(p.x - x) < 50));
    piegesSalle.push({ type, x, w, degats: d.degats * fDeg, t: Math.random() * 3, arme: false, chrono: 0, actif: false, fini: false });
  }
}
function majPiegesSalle(dt) {
  const corps = corpsJoueur(), auSol = corps.y + corps.h >= SOL - 2;
  for (const p of piegesSalle) {
    if (p.fini) continue;
    const d = PIEGES[p.type];
    if (p.type === "explosif") {
      if (!p.arme && auSol && chevauche(corps, { x: p.x, y: SOL - 4, w: p.w, h: 4 })) { p.arme = true; p.chrono = d.delai; son("menu"); nombre(p.x + 5, SOL - 14, "CLIC !", C.corail); }
      if (p.arme) {
        p.chrono -= dt;
        if (Math.floor(p.chrono * 10) % 2 === 0) son("menu");
        if (p.chrono <= 0) { // boum : Nexi et les ennemis proches
          p.fini = true; secousse = 0.3; son("explosion");
          for (let i = 0; i < 24; i++) particule(p.x + 5, SOL - 4, rnd(-90, 90), rnd(-120, -10), i % 3 ? "#ff8a3c" : "#ffd84d", 0.5);
          const cx = p.x + 5;
          if (Math.abs(J.x + J.w / 2 - cx) < d.rayon) blesserJoueur(p.degats, cx, "feu");
          for (const e of ennemis) if (!e.mort && Math.abs(e.x + e.w / 2 - cx) < d.rayon && e.y + e.h > SOL - 30) infligerDegats(e, p.degats * 2, true);
        }
      }
    } else {
      p.t += dt;
      const cycle = d.actif + d.repos, phase = p.t % cycle;
      p.prevenir = phase > d.repos - 0.5 && phase < d.repos;   // ça grésille juste avant
      p.actif = phase >= d.repos;
      const zone = { x: p.x, y: SOL - (p.type === "brulant" ? 16 : 20), w: p.w, h: p.type === "brulant" ? 16 : 20 };
      if (p.actif && chevauche(corps, zone)) {
        if (p.type === "brulant") blesserJoueur(p.degats, p.x + p.w / 2, "feu");
        else { blesserJoueur(p.degats, p.x + p.w / 2, "foudre"); J.fige = Math.max(J.fige, d.paralysie); }
      }
      if (p.actif && p.type === "brulant" && Math.random() < 0.8) particule(p.x + rnd(0, p.w), SOL - 2, rnd(-6, 6), rnd(-90, -50), Math.random() < 0.5 ? "#ff8a3c" : "#ffd84d", 0.25);
    }
  }
}
function dessinerPiegesSalle(ox, oy) {

// ---------- Particules et textes ----------
function particule(x, y, vx, vy, c, vie) { if (particules.length > 180) particules.shift(); particules.push({ x, y, vx, vy, c, vie, t: vie }); }
function nombre(x, y, txt, c, vie) { textes.push({ x, y, txt, c, t: vie || 0.8 }); }
function majEffets(dt) {
  for (const p of particules) { p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; }
  particules = particules.filter(p => p.t > 0);
  for (const t of textes) { t.t -= dt; t.y -= 14 * dt; }
  textes = textes.filter(t => t.t > 0);
  secousse = Math.max(0, secousse - dt);
}


/* ==================================================================
   ★★ CODEUR — CONTRÔLES (tactile + clavier pour tester sur PC)
   Clavier : ← → (ou Q D), ↓ (ou S), Espace = saut, J = combo léger, K = compétence
   ================================================================== */
const pointeurs = new Map(), clavier = {}, clavierBref = {};
let touches = {}, appui = {}, precedent = {}, boutons = [], tapEnAttente = false;
function placerBoutons() {
  // ★★ CODEUR — chaque bouton a sa couleur : fond, bord, reflet
  const k = REGLAGES.grandsBoutons ? 1.15 : 1;          // réglage « taille des boutons »
  const r = Math.round(13 * k), R = Math.round(14 * k), y = VH - 3 - R;
  const croix = { fond: "#241a44", bord: "#8b7fc0", reflet: "#c9b0ff" };
  boutons = [
    { id: "gauche", x: 3 + r, y, r, icone: "ic_gauche", ...croix },
    { id: "bas",    x: 3 + r + (2 * r + 2), y, r, icone: "ic_bas", ...croix },
    { id: "droite", x: 3 + r + 2 * (2 * r + 2), y, r, icone: "ic_droite", ...croix },
    { id: "saut",   x: VW - 3 - R, y, r: R, icone: "ic_saut", fond: "#2c2056", bord: "#c9b0ff", reflet: "#ffffff" },
    { id: "lourd",  x: VW - 3 - R - (2 * R + 2), y, r: R, icone: "ic_bouclier", fond: "#0c3330", bord: "#3DF5C4", reflet: "#b8fff0" }, // la compétence
    { id: "leger",  x: VW - 3 - R - (2 * R + 2) - (R + r + 3), y, r, icone: "ic_epee", fond: "#45122c", bord: "#FF5E7A", reflet: "#ffb3c0" },
  ];
}
function lireTouches() {
  const t = { gauche: false, droite: false, bas: false, saut: false, leger: false, lourd: false };
  for (const p of pointeurs.values()) {
    const lx = p.x * dpr / ZOOM, ly = p.y * dpr / ZOOM;
    for (const b of boutons) if (Math.hypot(lx - b.x, ly - b.y) < b.r * 1.15) t[b.id] = true;
  }
  const k = (code) => clavier[code] || clavierBref[code];
  if (k("ArrowLeft") || k("KeyA") || k("KeyQ")) t.gauche = true;
  if (k("ArrowRight") || k("KeyD")) t.droite = true;

    if (!x.faite) { const r = Math.round(x.r * x.t / x.delai); if (Math.floor(temps * 20) % 2) for (let a = 0; a < 360; a += 12) px(x.x - ox + Math.cos(a * Math.PI / 180) * r, x.y - oy + Math.sin(a * Math.PI / 180) * r, COUL_ELEMENT.feu); }
    else { const k = (x.t - x.delai) / 0.3; disque(Math.round(x.x - ox), Math.round(x.y - oy), Math.round(x.r * (0.5 + k * 0.5)), k < 0.5 ? "#ffd84d" : "#ff8a3c"); }
  }
  for (const e of eclairs) {
    let x = e.x - ox, y = 0;
    while (y < e.yBas - oy) { const nx = x + Math.round(rnd(-4, 4)); rect(Math.min(x, nx), y, Math.abs(nx - x) + 1, 1, "#FFE14D"); rect(nx, y, 1, 6, "#ffffff"); x = nx; y += 6; }
  }
  for (const p of particules) { g.globalAlpha = Math.max(0, p.t / p.vie); px(p.x - ox, p.y - oy, p.c); }
  g.globalAlpha = 1;
  for (const t of textes) texteCentre(t.txt, t.x - ox, Math.round(t.y - oy), t.c, C.encre);
  if (aEffet("corrompue") && etat === "jeu") dessinerVoileCorrompu(ox, oy);
  dessinerEcrans();
  dessinerHUD();
  dessinerHUDBoss();
  dessinerBarreBoss();
  dessinerCarteTitre();
  if (etat === "jeu") for (const b of boutons) bouton(b, touches[b.id]);
  if (banniere && etat === "jeu") {
    const sous = couperTexte(banniere.sous, VW - 20);
    const w = Math.min(VW - 8, Math.max(largeurTexte(banniere.titre), ...sous.map(largeurTexte)) + 12), x = Math.round(VW / 2 - w / 2), y = 30, h = 12 + 8 * sous.length;
    rect(x, y, w, h, C.encre); rect(x + 1, y + 1, w - 2, h - 2, "#1d1236"); rect(x + 1, y + 1, w - 2, 1, banniere.couleur);
    texteCentre(banniere.titre, VW / 2, y + 4, banniere.couleur); sous.forEach((l, i) => texteCentre(l, VW / 2, y + 12 + 8 * i, "#c9b0ff"));
  }
  if (etat === "ko") dessinerKO();
  if (etat === "victoire") dessinerVictoire();
  if (etat === "choixSalle") dessinerChoixSalle();
  if (etat === "menu" && menu) dessinerMenu();
}

function trame(couleur, decalage) { for (let y = 0; y < VH; y++) for (let x = (y + decalage) % 2; x < VW; x += 2) px(x, y, couleur); }
function titreGlitch(t, y) {
  const d = Math.random() < 0.1 ? 2 : 1;
  texteGrand(t, VW / 2 - d, y, C.corail); texteGrand(t, VW / 2 + d, y, C.menthe); texteGrand(t, VW / 2, y, "#f2eeff");
}
function dessinerTitre() {
  trame("rgba(7,4,15,0.6)", 0);
  const y = Math.round(VH * 0.26);
  titreGlitch("NEXI : INFECTION", y);
  texteCentre("L'ABYSSE DU DARK WEB T'ATTEND", VW / 2, y + 16, "#c9b0ff");
  if (Math.floor(temps * 2) % 2 === 0) texteCentre("TOUCHE L'ÉCRAN OU APPUIE SUR ENTRÉE POUR PLONGER", VW / 2, y + 34, C.menthe, C.encre);
  texteCentre("SUR PC : FLÈCHES OU ZQSD, ESPACE (SAUT)", VW / 2, y + 46, "#c9b0ff", C.encre);
  texteCentre("J (ATTAQUE), K (COMPÉTENCE), ÉCHAP (PAUSE)", VW / 2, y + 54, "#c9b0ff", C.encre);
  texteCentre("LA PARTIE SE SAUVEGARDE AUX TERMINAUX (SALLES DE REPOS)", VW / 2, VH - 16, "#8b7fc0", C.encre);
  texteCentre("NEXA DIGITAL SCHOOL - CE JEU NE COLLECTE AUCUNE DONNÉE", VW / 2, VH - 8, "#6d6a9a");
  texte(VERSION, VW - 4 - largeurTexte(VERSION), 4, "#6d6a9a", C.encre);
  if (MODE_DEMO) texte("MODE DÉMO", VW - 4 - largeurTexte("MODE DÉMO"), 12, "#ffd84d", C.encre);
  const z = zoneSauvegardeTitre();   // petit bouton pour importer une sauvegarde
  rect(z.x, z.y, z.w, z.h, "#1d1236"); rect(z.x, z.y, z.w, 1, "#ffd84d");
  texteCentre(partieSauvee ? "CONTINUER -" + profondeur(partieSauvee.salle) + " M" : "SAUVEGARDE", z.x + z.w / 2, z.y + 4, "#ffd84d");
}
function zoneSauvegardeTitre() { return { x: 4, y: 4, w: 82, h: 12 }; }
function dessinerKO() {
  trame("rgba(60,4,30,0.7)", Math.floor(tKo * 10));
  if (tKo < 1.2 || Math.random() < 0.08) { const yy = Math.floor(rnd(0, VH - 8)), h = Math.floor(rnd(2, 8)); g.drawImage(bas, 0, yy, VW, h, Math.round(rnd(-8, 8)), yy, VW, h); }
  const y = Math.round(VH * 0.28);
  titreGlitch(MESSAGE_KO, y);
  texteCentre(SOUS_TITRE_KO, VW / 2, y + 16, C.texte);
  texteCentre("PROFONDEUR -" + profondeur(salle) + " M  -  ENNEMIS VAINCUS : " + tues + "  -  RECORD : -" + profondeur(record) + " M", VW / 2, y + 26, "#c9b0ff");
  if (tKo > 0.9 && Math.floor(temps * 2) % 2 === 0) texteCentre("TOUCHE POUR REPLONGER DEPUIS LA SURFACE", VW / 2, y + 44, C.menthe);
}


/* ==================================================================
   ★★ CODEUR — DÉMARRAGE ET BOUCLE DE JEU
   ================================================================== */
function redimensionner() {
  dpr = window.devicePixelRatio || 1;
  const lp = Math.round(window.innerWidth * dpr), hp = Math.round(window.innerHeight * dpr);
  ZOOM = Math.max(1, Math.round(hp / 135));         // agrandissement entier = pixels nets
  VH = Math.ceil(hp / ZOOM); VW = Math.ceil(lp / ZOOM);
  const ancienSol = SOL;
  SOL = VH - 35;
  cv.width = lp; cv.height = hp;
  cv.style.width = window.innerWidth + "px"; cv.style.height = window.innerHeight + "px";
  bas = nouveauCanvas(VW, VH);
  const ouverte = porte ? porte.ouverte : false;
  genererDecor(etat === "titre" ? 0 : salle);
  porte.ouverte = ouverte;
  placerBoutons();
  if (J) { // on recale tout ce qui est posé au sol
    const d = SOL - ancienSol;
    J.y += d;
    for (const e of ennemis) { e.y += d; e.baseY += d; }
    for (const p of pieges) p.y += d;
    for (const f of fioles) f.y += d;
  }
}
function pleinEcran() {
  try {
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().then(() => {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {});
    }).catch(() => {});
  } catch (err) { /* plein écran non disponible : pas grave */ }
}
function surTape() {
  if (etat === "titre") {
    pleinEcran();
    const z = zoneSauvegardeTitre(), lx = dernierTap ? dernierTap.x * dpr / ZOOM : -1, ly = dernierTap ? dernierTap.y * dpr / ZOOM : -1;
    const surBouton = lx >= z.x && lx < z.x + z.w && ly >= z.y && ly < z.y + z.h;
    if (partieSauvee || surBouton) menuTitre(); else { etat = "histoire"; tHist = 0; }
    dernierTap = null;
  }
  else if (etat === "histoire") { if (histoireFinie()) nouvellePartie(); else tHist = 999; }
  else if (etat === "ko" && tKo > 0.9) nouvellePartie();
  else if (etat === "victoire" && tVic > 3) { etat = "jeu"; banniere = { titre: "L'ABYSSE SANS FIN", sous: "Des échos du Tyran rôdent encore plus bas...", couleur: "#c9b0ff", t: 4 }; }
  else if (etat === "jeu" && dernierTap && surPause(dernierTap.x * dpr / ZOOM, dernierTap.y * dpr / ZOOM)) menuPause();
  else if (etat === "jeu" && introBoss && introBoss.t < 3.0) introBoss.t = 3.0; // passer l'entrée du boss
  else if (etat === "menu" && menu && dernierTap) toucherMenu(dernierTap.x * dpr / ZOOM, dernierTap.y * dpr / ZOOM);
  else if (etat === "choixSalle" && dernierTap) {
    const lx = dernierTap.x * dpr / ZOOM, ly = dernierTap.y * dpr / ZOOM;
    choixSalles.forEach((n, i) => { const r = caseChoix(i); if (lx >= r.x && lx < r.x + r.w && ly >= r.y && ly < r.y + r.h) choisirSalle(i); });
  }
}
let dernier = 0;
function boucle(ts) {
  // filet de sécurité : une erreur dans une image ne doit pas figer tout le jeu
  try { image(ts); } catch (err) { console.error(err); }
  requestAnimationFrame(boucle);
}
function image(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - dernier) / 1000));
  changerTheme(themeVoulu());   // la musique suit l'ambiance
  dernier = ts; temps += dt;
  lireTouches();
  if (tapEnAttente) { tapEnAttente = false; surTape(); }
  if (window.innerHeight > window.innerWidth) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#07040f"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = "#3DF5C4"; ctx.font = "bold " + Math.round(18 * dpr) + "px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("↻ Tourne ton téléphone", cv.width / 2, cv.height / 2);
    return;
  }
  if (etat === "jeu") maj(dt);
  if (etat === "ko") tKo += dt;
  if (etat === "histoire") tHist += dt;
  if (etat === "victoire") tVic += dt;
  majEffets(dt);
  dessiner();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(bas, 0, 0, VW * ZOOM, VH * ZOOM);
}
function demarrer() {
  cv = document.getElementById("jeu"); ctx = cv.getContext("2d");
  preparerSprites();
  lireReglages();
  redimensionner();
  window.addEventListener("resize", redimensionner);
  const pos = ev => ({ x: ev.clientX, y: ev.clientY });
  lireSauvegardeLocale();
  cv.addEventListener("pointerdown", ev => { ev.preventDefault(); sonDemarrer(); pointeurs.set(ev.pointerId, pos(ev)); dernierTap = pos(ev); tapEnAttente = true; });
  cv.addEventListener("pointermove", ev => {
    if (!pointeurs.has(ev.pointerId)) return;
    pointeurs.set(ev.pointerId, pos(ev));
    if (etat === "menu" && menu && menu.glisse !== undefined) reglerCurseur(menu.glisse, pos(ev).x * dpr / ZOOM);   // on glisse la barre
  });
  const lacher = ev => { pointeurs.delete(ev.pointerId); if (menu) menu.glisse = undefined; };
  cv.addEventListener("pointerup", lacher); cv.addEventListener("pointercancel", lacher); cv.addEventListener("pointerleave", lacher);
  cv.addEventListener("contextmenu", ev => ev.preventDefault());
  window.addEventListener("keydown", ev => {
    if (saisieOuverte) return;                       // on tape un code : le jeu n'écoute pas
    sonDemarrer();
    if (etat === "jeu" && (ev.code === "Escape" || ev.code === "KeyP")) { menuPause(); ev.preventDefault(); return; }
    clavier[ev.code] = true; clavierBref[ev.code] = true;
    if (etat === "menu" && menu) { clavierMenu(ev.code); ev.preventDefault(); return; }
    if (etat === "choixSalle" && /^Digit[0-9]$/.test(ev.code)) { const d = +ev.code.slice(5); choisirSalle(d === 0 ? 9 : d - 1); return; }
    if (ev.code === "Enter" || ev.code === "Space") tapEnAttente = true;
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(ev.code)) ev.preventDefault();
  });
  window.addEventListener("keyup", ev => { clavier[ev.code] = false; });
  window.addEventListener("blur", () => { for (const k in clavier) clavier[k] = false; pointeurs.clear(); });
  requestAnimationFrame(boucle);
}
demarrer();
</script>
