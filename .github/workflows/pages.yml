# Publie le jeu sur GitHub Pages à chaque envoi :
#   branche main -> https://<pseudo>.github.io/Nexi-infection/      (version stable)
#   branche dev  -> https://<pseudo>.github.io/Nexi-infection/dev/  (version de test)
name: Publier le jeu

# GitHub n'autorise la publication que depuis main : un envoi sur dev
# déclenche d'abord « Signal dev » (dev.yml), qui relance cette publication depuis main.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Signal dev"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # les publications attendent leur tour au lieu de s'annuler (sinon croix rouge sur main)

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer la version stable (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Récupérer la version de test (dev)
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
        continue-on-error: true
      - name: Assembler le site (jeu, atelier, page « jouer », versions d'origine, guide)
        run: |
          assembler() {   # $1 = dossier de la branche, $2 = dossier du site
            mkdir -p "$2"
            python3 "$1/outils/archiver_version.py" || true
            cp "$1/index.html" "$2/"
            for f in outils.js atelier jouer versions guide; do
              if [ -e "$1/$f" ]; then cp -r "$1/$f" "$2/"; fi
            done
          }
          assembler main site
          if [ -f dev/index.html ]; then assembler dev site/dev; else assembler main site/dev; fi
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
