# Publie le jeu sur GitHub Pages à chaque envoi :
#   branche main -> https://<pseudo>.github.io/Nexi-infection/      (version stable)
#   branche dev  -> https://<pseudo>.github.io/Nexi-infection/dev/  (version de test)
name: Publier le jeu

# GitHub n'autorise la publication que depuis main : un envoi sur dev
# déclenche d'abord « Signal dev » (dev.yml), qui relance cette publication depuis main.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Signal dev"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer la version stable (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Récupérer la version de test (dev)
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
        continue-on-error: true
      - name: Assembler le site
        run: |
          mkdir -p site/dev
          cp main/index.html site/index.html
          if [ -f dev/index.html ]; then cp dev/index.html site/dev/index.html; else cp main/index.html site/dev/index.html; fi
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
