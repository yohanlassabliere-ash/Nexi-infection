<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07040f">
<title>Ma version de Nexi</title>
<style>
  :root { color-scheme: dark; --fond: #07040f; --panneau: #1d1236; --texte: #e8e2ff; --doux: #8b7fc0; --menthe: #3df5c4; --or: #ffd84d; --corail: #ff5e7a; }
  html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte); font: 15px/1.5 system-ui, sans-serif; }
  .carte { max-width: 460px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
  h1 { font: bold 22px "Courier New", monospace; color: var(--or); margin: 0; letter-spacing: 1px; }
  p { margin: 0; color: var(--doux); }
  button { font: bold 16px "Courier New", monospace; padding: 14px; border: 2px solid var(--doux); background: var(--panneau); color: var(--texte); cursor: pointer; }
  button.jouer { border-color: var(--menthe); color: var(--menthe); font-size: 20px; }
  .erreur { color: var(--corail); }
</style>
</head>
<body>
<div class="carte">
  <h1>NEXI : INFECTION</h1>
  <p id="message">Chargement de ta version…</p>
  <button class="jouer" id="jouer" hidden>▶ JOUER À MA VERSION</button>
  <button id="telecharger" hidden>TÉLÉCHARGER MON CODE</button>
  <p>Ta version est enregistrée dans ce lien : garde-le (favori, message, capture du QR) pour y rejouer plus tard.</p>
</div>
<script src="../outils.js"></script>
<script>
"use strict";
(async () => {
  const msg = document.getElementById("message");
  try {
    const paquet = await ouvrirPaquet(decodeURIComponent(location.hash.slice(1)));
    if (!paquet.id) throw new Error("Lien incomplet : rescanne le QR code de l'atelier.");
    const r = await fetch("../versions/" + paquet.id + ".html");
    if (!r.ok) throw new Error("La version d'origine de ce code n'est plus en ligne.");
    const original = (await r.text()).replace(/\r\n/g, "\n");
    const codeVisiteur = appliquerDifferences(original.split("\n"), paquet.blocs).join("\n");
    // pour jouer ici, ta version a sa propre sauvegarde, séparée du jeu officiel
    const code = codeVisiteur.replace(/"nexi_infection_sauvegarde"/g, '"nexi_infection_sauvegarde_atelier"');
    const nb = paquet.blocs.reduce((s, b) => s + Math.max(b[1], b[2].length), 0);
    msg.textContent = nb ? "Ta version contient " + nb + " ligne(s) modifiée(s)." : "C'est la version d'origine du jeu.";
    const jouer = document.getElementById("jouer"), dl = document.getElementById("telecharger");
    jouer.hidden = dl.hidden = false;
    jouer.onclick = () => { document.open(); document.write(code); document.close(); };
    dl.onclick = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([codeVisiteur], { type: "text/html;charset=utf-8" }));
      a.download = "nexi_infection_ma_version.html"; document.body.appendChild(a); a.click(); a.remove();
    };
  } catch (e) { msg.className = "erreur"; msg.textContent = e.message || "Impossible d'ouvrir cette version."; }
})();
</script>
</body>
</html>
